apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: todo-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          # ⚠️ Твой образ в твоём GHCR!
          image: ghcr.io/mikkizxc/todo-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres-service:5432/todo_db"
            - name: SPRING_DATASOURCE_USERNAME
              value: "todo"
            - name: SPRING_DATASOURCE_PASSWORD
              value: "todo123"
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: "update"
            - name: OAUTH2_SECURITY_ENABLED
              value: "false"
          readinessProbe:
            httpGet:
              path: /backend/manage/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
