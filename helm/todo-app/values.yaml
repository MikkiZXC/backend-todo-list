global:
  namespace: todo-app

# Backend
backend:
  replicaCount: 2
  image:
    repository: ghcr.io/mikkizxc/todo-backend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
    targetPort: 8080
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"
  env:
    SPRING_DATASOURCE_URL: "jdbc:postgresql://todo-app-postgres:5432/todo_db"
    SPRING_DATASOURCE_USERNAME: "todo"
    SPRING_DATASOURCE_PASSWORD: "todo123"
    SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
    OAUTH2_SECURITY_ENABLED: "false"
  readinessProbe:
    path: /backend/manage/health
    port: 8080
    initialDelaySeconds: 10
    periodSeconds: 10

# Frontend
frontend:
  replicaCount: 1
  nginx:
    backendService: "todo-app-backend" 
    backendPort: 80
  image:
    repository: ghcr.io/mikkizxc/todo-frontend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: NodePort
    port: 80
    targetPort: 80
    nodePort: 30081

# Postgres
postgres:
  enabled: true
  image:
    repository: postgres
    tag: "15-alpine"
  service:
    type: ClusterIP
    port: 5432
  env:
    POSTGRES_DB: "todo_db"
    POSTGRES_USER: "todo"
    POSTGRES_PASSWORD: "todo123"
  persistence:
    enabled: false  # Для dev используем emptyDir

ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: todo.local
      paths:
        - path: /
          pathType: Prefix
          service: frontend
          port: 80
  tls: []