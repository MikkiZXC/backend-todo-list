{{- /*
Postgres Service: ClusterIP для доступа внутри кластера
*/ -}}

{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "todo-app.fullname" . }}-postgres
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "todo-app.labels" . | nindent 4 }}
spec:
  type: {{ .Values.postgres.service.type }}  # ClusterIP
  
  selector:
    {{- include "todo-app.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
  
  ports:
    - name: postgres
      protocol: TCP
      port: {{ .Values.postgres.service.port }}  # 5432
      targetPort: 5432
{{- end }}