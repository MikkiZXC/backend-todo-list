{{- /*
Backend Service: обеспечивает стабильный DNS-имя и балансировку между подами
*/ -}}

apiVersion: v1
kind: Service
metadata:
  name: {{ include "todo-app.fullname" . }}-backend
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "todo-app.labels" . | nindent 4 }}
spec:
  # ClusterIP = доступно только внутри кластера
  type: {{ .Values.backend.service.type }}
  
  # Селектор: на какие поды направлять трафик
  selector:
    {{- include "todo-app.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  
  # Порты: как сервис принимает и перенаправляет трафик
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.backend.service.port }}           # Порт сервиса (80)
      targetPort: {{ .Values.backend.service.targetPort }} # Порт в контейнере (8080)