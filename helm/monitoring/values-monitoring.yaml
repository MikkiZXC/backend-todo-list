# === Глобальные настройки ===
global:
  commonLabels:
    environment: dev

# === Prometheus ===
prometheus:
  prometheusSpec:
    # Храним метрики 7 дней (для dev достаточно)
    retention: 7d
    # Ресурсы для dev-окружения
    resources:
      requests:
        memory: 512Mi
        cpu: 250m
      limits:
        memory: 2Gi
        cpu: 1000m
    # Добавляем наш todo-app в скрейпинг
    additionalScrapeConfigs:
      - job_name: 'todo-app-backend'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - todo-app
        relabel_configs:
          # Скрейпим только поды с меткой component=backend
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
            action: keep
            regex: backend
          # Порт для метрик (Spring Actuator)
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            action: keep
            regex: 8080
          # Путь к метрикам
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          # Итоговый URL: http://<pod-ip>:8080/actuator/prometheus
        metrics_path: /actuator/prometheus
        scrape_interval: 30s

# === Grafana ===
grafana:
  # Включаем доступ извне (для dev)
  service:
    type: ClusterIP  # Позже сделаем ingress или port-forward
  # Дефолтные креды (смени в production!)
  adminUser: admin
  adminPassword: admin123

  env:
    # Отключаем проверку SSL при установке плагинов
    GF_PLUGIN_ADMIN_ENABLED: "true"
    GF_INSTALL_PLUGINS_SKIP_TLS_VERIFY: "true" 

  livenessProbe:
    httpGet:
      path: /api/health
      port: 3000
    initialDelaySeconds: 60  # Ждем 60 сек перед первой проверкой
    timeoutSeconds: 5
    periodSeconds: 10
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /api/health
      port: 3000
    initialDelaySeconds: 60  # Ждем 60 сек перед первой проверкой
    timeoutSeconds: 5
    periodSeconds: 10
    failureThreshold: 3
  # Плагины для удобства
  plugins: []
  # Датасорс Prometheus уже настроен чартом автоматически 🎉

# === Node Exporter (метрики хостов) ===
kube-state-metrics:
  enabled: true
prometheus-node-exporter:
  enabled: true

# === Отключаем лишнее для dev ===
alertmanager:
  enabled: false  # Включим позже, когда настроим уведомления